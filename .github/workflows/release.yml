name: Release

# Stable release — MANUAL dispatch only. Runs CI, builds the per-platform binaries, then cuts a
# dated GitHub Release. Versions are never taken from a git tag: version.pl composes them from the
# VERSION file plus the commit count, so the repo-level marker is the date — the Release/tag is
# `vyyyyMMdd`. Nightlies happen automatically (nightly.yml).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    uses: ./.github/workflows/_build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      # At most ONE release per day, and it is the latest: a second run today replaces the first
      # outright. Retiring the earlier release re-cuts the tag on the new commit; the local tag goes
      # too, before the notes are generated, so the day's release describes the whole day.
      - name: Retire an earlier release from the same day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing today's earlier release $REL."
            gh release delete "$REL" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
          git tag -d "$REL" 2>/dev/null || true

      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update changelog + generate release notes (bucketed by + - * # !)
        run: node .github/workflows/scripts/update-changelog.mjs --release "$REL" --notes RELEASE_NOTES.md

      # The changelog commit lands BEFORE the release is cut and the tag is placed on it, so the
      # bookkeeping commit never pollutes the next release's notes. Runner commits are unsigned, so
      # this goes through the contents API via the shared action, which GitHub signs — a raw push
      # would be rejected by the DontDelete ruleset's required-signatures rule.
      - name: Commit changelog (if it changed)
        if: ${{ hashFiles('CHANGELOG.md') != '' }}
        uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: CHANGELOG.md
          message: "* update changelog for ${{ env.REL }} [skip ci]"

      - name: Create GitHub Release (dated marker; tags vyyyyMMdd)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }}
          files: dist/*
          body_path: RELEASE_NOTES.md
