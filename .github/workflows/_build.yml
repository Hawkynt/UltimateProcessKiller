name: Build artifacts

# Shared build/publish block. Called by release.yml (manual dispatch) and nightly.yml (auto, on CI
# success). The single place that turns a commit into shippable binaries, so release and nightly can
# never diverge. UltimateProcessKiller ships as applications, not NuGet packages: this packs the CLI
# and the GUI as single-file NativeAOT executables per platform.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build (defaults to caller ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0                           # version.pl counts commits
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compute version
        id: version
        shell: bash
        run: echo "value=$(perl .github/workflows/scripts/version.pl)" >> "$GITHUB_OUTPUT"
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the CLI and GUI (single-file NativeAOT)
        shell: bash
        run: |
          FLAGS="-c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.value }}"
          dotnet publish UltimateProcessKiller.Cli/UltimateProcessKiller.Cli.csproj $FLAGS -o "stage/${{ matrix.rid }}"
          dotnet publish UltimateProcessKiller.Gui/UltimateProcessKiller.Gui.csproj $FLAGS -o "stage/${{ matrix.rid }}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp README.md LICENSE "stage/${{ matrix.rid }}/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "stage/${{ matrix.rid }}" && 7z a -tzip "../../dist/UltimateProcessKiller-${{ matrix.rid }}.zip" . >/dev/null)
          else
            tar czf "dist/UltimateProcessKiller-${{ matrix.rid }}.tar.gz" -C "stage/${{ matrix.rid }}" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
